version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: vetagenda-db
    restart: always
    environment:
      POSTGRES_DB: vetagenda
      POSTGRES_USER: vetagenda
      POSTGRES_PASSWORD: vetagenda123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetagenda -d vetagenda"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetagenda-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vetagenda
      SPRING_DATASOURCE_USERNAME: vetagenda
      SPRING_DATASOURCE_PASSWORD: vetagenda123
    command: ["./mvnw", "spring-boot:run"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetagenda-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
    driver: local
